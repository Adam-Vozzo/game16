<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=contain">
<meta name="theme-color" content="#050b1b">
<title>Soft Mountain</title>
<style>
* { box-sizing: border-box; }
:root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050b1b; }
body { font-family: system-ui, sans-serif; color: #e2f6f2; }
#canvas { display: block; outline: none; touch-action: none; }
#loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 40%, #102934 0%, #091728 35%, #050b1b 72%);
  transition: opacity .4s ease; }
#loading.finished { opacity: 0; pointer-events: none; }
.composition { width: min(1100px, 100vw, 120vh); text-align: center; }
.art { display: block; width: 100%; height: auto; }
.readout { width: min(320px, 68vw); margin: -5% auto 0; position: relative; }
.status-row { display: flex; justify-content: space-between; gap: 16px; font-size: 12px;
  color: #9dbdbf; letter-spacing: .05em; margin-bottom: 14px; }
progress { display: block; width: 100%; height: 3px; appearance: none; border: 0;
  border-radius: 9px; overflow: hidden; background: #1c3443; color: #8de8dc; }
progress::-webkit-progress-bar { background: #1c3443; border-radius: 9px; }
progress::-webkit-progress-value { background: linear-gradient(90deg, #9489db, #8de8dc); border-radius: 9px; }
progress::-moz-progress-bar { background: linear-gradient(90deg, #9489db, #8de8dc); border-radius: 9px; }
progress:indeterminate::-webkit-progress-bar { background: linear-gradient(90deg, #1c3443, #8de8dc, #1c3443); }
progress:indeterminate { animation: breathe 1.8s ease-in-out infinite alternate; }
[hidden] { display: none !important; }
.hint { font-size: 10px; color: #597885; letter-spacing: .16em; margin-top: 24px; }
.mobile-hint { display: none; }
@media (max-width: 900px), (pointer: coarse) and (max-width: 1100px) { .desktop-hint { display: none; } .mobile-hint { display: inline; } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }
#notice { color: #efc6bb; font-size: 13px; line-height: 1.6; }
#retry { margin-top: 12px; border: 1px solid #547d89; border-radius: 12px;
  background: #153440; color: #d5f4ec; padding: 10px 24px; cursor: pointer; }
#retry:focus-visible { outline: 2px solid #8de8dc; outline-offset: 3px; }
noscript { position: fixed; bottom: 8%; z-index: 20; width: 100%; text-align: center; }
@keyframes breathe { from { opacity: .35; } to { opacity: 1; } }
@media (max-height: 540px) { .composition { width: min(900px, 95vw, 95vh); } .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { #loading { transition: none; } progress { animation: none !important; } }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="description" content="Toss squishy cells into a bowl. Match colours, merge, and build a Soft Mountain. Keyboard, mouse, and touch controls supported.">
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Soft Mountain game">Your browser needs canvas support to play.</canvas>
<section id="loading" aria-label="Loading Soft Mountain" aria-busy="true">
  <div class="composition">
    <h1 class="sr-only">Soft Mountain — Tidal Glow</h1>
    <img class="art" src="index.png" width="1440" height="900" alt="Three luminous jelly cells drifting above a tidal current">
    <div class="readout">
      <div class="status-row"><span id="phase" role="status">Gathering the glow</span><span id="percent" aria-hidden="true"></span></div>
      <progress id="progress" aria-label="Game download progress"></progress>
      <p id="notice" role="alert" hidden></p>
      <button id="retry" hidden>Try again</button>
      <p class="hint"><span class="desktop-hint">KEYBOARD &amp; MOUSE</span><span class="mobile-hint">TOUCH TO PLAY</span></p>
    </div>
  </div>
</section>
<noscript>Enable JavaScript to enter the tidal pool.</noscript>
<script>
(() => {
  const overlay = document.getElementById('loading');
  const phase = document.getElementById('phase');
  const percent = document.getElementById('percent');
  const progress = document.getElementById('progress');
  const notice = document.getElementById('notice');
  const retry = document.getElementById('retry');
  let failed = false;
  retry.addEventListener('click', () => location.reload());
  function fail(message, error) {
    failed = true;
    overlay.setAttribute('aria-busy', 'false');
    phase.textContent = 'The pool is still quiet';
    percent.textContent = '';
    progress.hidden = true;
    notice.textContent = message;
    notice.hidden = false;
    retry.hidden = false;
    if (error) console.error(error);
  }
  // The game signals after its first rendered frame, rather than hiding this
  // overlay as soon as the engine download finishes.
  window.softMountainReady = () => {
    if (failed) return;
    overlay.setAttribute('aria-busy', 'false');
    overlay.classList.add('finished');
    document.getElementById('canvas').focus();
    setTimeout(() => { overlay.remove(); delete window.softMountainReady; }, 450);
  };
  const script = document.createElement('script');
  script.src = 'index.js';
  script.onerror = () => fail('Could not load the game. Check your connection and try again.');
  script.onload = () => {
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      fail('This pool needs WebGL 2. Please use a browser with hardware acceleration enabled.');
      return;
    }
    const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":464552,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
    engine.startGame({ onProgress: (current, total) => {
      if (failed) return;
      if (total > 0 && current < total) {
        progress.max = total;
        progress.value = current;
        percent.textContent = Math.floor(current / total * 100) + '%';
        phase.textContent = 'Gathering the glow';
      } else {
        progress.removeAttribute('value');
        percent.textContent = '';
        phase.textContent = current > 0 ? 'Waking the tidal pool' : 'Gathering the glow';
      }
    }}).catch(error => fail('Could not open the pool. Check your connection and try again.', error));
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
